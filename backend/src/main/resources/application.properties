spring.application.name=chakulasmart-api
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Database: same PostgreSQL server + credentials as the existing "tickets" app,
# but a separate database called "chakulasmart". The app CREATES that database
# on first start if it does not exist (DatabaseBootstrap.java), then Flyway
# creates the tables and loads the Kenyan food + recipe library.
# Variables use a CHAKULA_ prefix so they never clash with the tickets app.
# ---------------------------------------------------------------------------
spring.datasource.url=${CHAKULA_DB_URL:jdbc:postgresql://localhost:5432/chakulasmart}
spring.datasource.username=${CHAKULA_DB_USER:tickets}
spring.datasource.password=${CHAKULA_DB_PASSWORD:tickets}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT: set JWT_SECRET to a long random string (32+ chars) in production.
app.jwt.secret=${JWT_SECRET:chakulasmart-dev-secret-change-me-in-production-0123456789}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:72}

# Browsers allowed to call the API (the React dev server by default).
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# Public URL of the web app. Used for the links in emails (invitations, password reset).
app.base-url=${APP_BASE_URL:http://localhost:5173}

# First administrator. Created on startup if no user has this email. CHANGE THE PASSWORD IN PRODUCTION.
app.admin.email=${ADMIN_EMAIL:admin@chakulasmart.com}
app.admin.password=${ADMIN_PASSWORD:Demo@1234}
app.admin.name=${ADMIN_NAME:ChakulaSmart Admin}

# Email. Emails are really sent only when SPRING_MAIL_HOST is set (plus SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD). Without it every email is printed in the backend log, so links still work in development.
app.mail.from=${MAIL_FROM:ChakulaSmart <no-reply@chakulasmart.com>}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

logging.level.com.chakulasmart=INFO
