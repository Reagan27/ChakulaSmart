# Optional: only needed if you do NOT already have PostgreSQL running locally.
# Uses the same credentials as your existing "tickets" setup.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
